        // Algoritmo robusto de Exponential Backoff para chamadas estáveis à API do Gemini (MANDATÓRIO)
        const fetchWithRetry = async (url, options, maxRetries = 5) => {
            let delay = 1000;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) {
                        return response;
                    }
                    if (response.status === 429 || response.status >= 500) {
                        await new Promise(resolve => setTimeout(resolve, delay));
                        delay *= 2;
                        continue;
                    }
                    return response;
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }
            throw new Error("Falha após várias tentativas de ligação à API do Gemini.");
        };

        const compressImageFile = (file, maxWidth = 450, maxHeight = 450, quality = 0.6) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        };

        function App() {
            const [firebaseConfig, setFirebaseConfig] = useState(() => {
                const saved = localStorage.getItem('finfamily_firebase_config');

            const [firebaseError, setFirebaseError] = useState(null);
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [databaseMissingError, setDatabaseMissingError] = useState(false); 

            // Serviços do Firebase Compat
            const [fbServices, setFbServices] = useState({ auth: null, db: null });

            const [transactions, setTransactions] = useState([]);
            const [budgets, setBudgets] = useState(INITIAL_BUDGETS);
            const [goals, setGoals] = useState(INITIAL_GOALS);
            const [familyMembers, setFamilyMembers] = useState(FAMILY_MEMBERS_DEFAULT);

            const [selectedMonth, setSelectedMonth] = useState('2026-05');
            const [selectedMember, setSelectedMember] = useState('Todos');
            const [activeTab, setActiveTab] = useState('dashboard');

            const [authTab, setAuthTab] = useState('login');
            const [emailInput, setEmailInput] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [authErrorMsg, setAuthErrorMsg] = useState(null);

            const [isTransactionModalOpen, setIsTransactionModalOpen] = useState(false);
            const [editingTransaction, setEditingTransaction] = useState(null);
            const [isGoalModalOpen, setIsGoalModalOpen] = useState(false);
            const [editingGoal, setEditingGoal] = useState(null);
            const [isConfigModalOpen, setIsConfigModalOpen] = useState(false);
            const [viewingImage, setViewingImage] = useState(null); 
            
            const [txForm, setTxForm] = useState({

                member: 'Geral',
                description: '',
                category: 'Alimentação',
                amount: '',
                type: 'expense',
                status: 'pago',
                image: ''

            const [goalForm, setGoalForm] = useState({
                name: '',
                target: '',

            });

            const [confirmModal, setConfirmModal] = useState({ isOpen: false, title: '', message: '', onConfirm: null });
            const [promptModal, setPromptModal] = useState({ isOpen: false, title: '', placeholder: '', defaultValue: '', onSubmit: null });

            const [isScanningImage, setIsScanningImage] = useState(false);
            const [scanPurpose, setScanPurpose] = useState('boleto'); 
            const [scannedPreview, setScannedPreview] = useState(null);
            const [matchedTransactionId, setMatchedTransactionId] = useState('');
            const fileInputRef = useRef(null);

            const [toast, setToast] = useState(null);

            const [aiAdvice, setAiAdvice] = useState(null);
            const [isAiLoading, setIsAiLoading] = useState(false);
            const [aiError, setAiError] = useState(null);

            const [isAssistantOpen, setIsAssistantOpen] = useState(false);
            const [assistantMessages, setAssistantMessages] = useState([]);
            const [assistantInput, setAssistantInput] = useState('');
            const [isAssistantLoading, setIsAssistantLoading] = useState(false);
            const [assistantError, setAssistantError] = useState(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            const handleFirestoreError = (error) => {
                console.error("Firestore Error Detected:", error);
                if (error.code === 'not-found' || error.message.includes('database') || error.message.includes('does not exist') || error.message.includes('Datastore')) {
                    setDatabaseMissingError(true);
                    setIsOfflineMode(true);
                    localStorage.setItem('finfamily_offline_mode', 'true');
                }
            };

            // Inicialização do Firebase Compat
            useEffect(() => {
                if (!firebaseConfig) {
                    setAuthLoading(false);
                    return;
                }

                try {
                    if (!firebase.apps.length) {
                        firebase.initializeApp(firebaseConfig);
                    }
                    const auth = firebase.auth();
                    const db = firebase.firestore();

                    setFbServices({ auth, db });
                    setFirebaseError(null);

                    const initAuth = async () => {
                        try {
                            if (!auth.currentUser && !isOfflineMode) {
                                await auth.signInAnonymously();
                            }
                        } catch (err) {
                            console.warn("Autenticação anónima indisponível no browser local.");
                        }
                    };
                    initAuth();

                    const unsubscribe = auth.onAuthStateChanged((currentUser) => {
                        setUser(currentUser);
                        setAuthLoading(false);
                    });

                    return () => unsubscribe();
                } catch (error) {
                    console.error("Firebase startup error:", error);
                    setFirebaseError("Falha ao inicializar o banco Firebase. A utilizar em modo Offline.");
                    setAuthLoading(false);
                    setIsOfflineMode(true);
                }
            }, [firebaseConfig, isOfflineMode]);

            // Backup e modo offline
            useEffect(() => {
                if (isOfflineMode || firebaseError) {
                    const localTx = localStorage.getItem('finfamily_transactions');
                    const localBudgets = localStorage.getItem('finfamily_budgets');
                    const localGoals = localStorage.getItem('finfamily_goals');
                    const localMembers = localStorage.getItem('finfamily_members');

                    setTransactions(localTx ? JSON.parse(localTx) : INITIAL_TRANSACTIONS);
                    setBudgets(localBudgets ? JSON.parse(localBudgets) : INITIAL_BUDGETS);
                    setGoals(localGoals ? JSON.parse(localGoals) : INITIAL_GOALS);
                    setFamilyMembers(localMembers ? JSON.parse(localMembers) : FAMILY_MEMBERS_DEFAULT);
                    setAuthLoading(false);
                }
            }, [isOfflineMode, firebaseError]);

            // Escuta ativa do Firestore em tempo real
            useEffect(() => {
                const { db } = fbServices;
                if (!db || !user || isOfflineMode) return;

                const txCollectionRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('transactions');
                const unsubscribeTx = txCollectionRef.onSnapshot((snapshot) => {
                    const txList = [];
                    snapshot.forEach(doc => {
                        txList.push({ id: doc.id, ...doc.data() });
                    });
                    setTransactions(txList);
                }, (error) => handleFirestoreError(error));

                const goalsCollectionRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('goals');
                const unsubscribeGoals = goalsCollectionRef.onSnapshot((snapshot) => {
                    const goalList = [];
                    snapshot.forEach(doc => {
                        goalList.push({ id: doc.id, ...doc.data() });
                    });
                    setGoals(goalList);
                }, (error) => handleFirestoreError(error));

                const budgetsDocRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('settings').doc('budgets');
                const unsubscribeBudgets = budgetsDocRef.onSnapshot((docSnap) => {
                    if (docSnap.exists) {
                        setBudgets(docSnap.data());
                    } else {
                        budgetsDocRef.set(INITIAL_BUDGETS).catch(err => handleFirestoreError(err));
                        setBudgets(INITIAL_BUDGETS);
                    }
                }, (error) => handleFirestoreError(error));

                const membersDocRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('settings').doc('members');
                const unsubscribeMembers = membersDocRef.onSnapshot((docSnap) => {
                    if (docSnap.exists) {
                        setFamilyMembers(docSnap.data().list || FAMILY_MEMBERS_DEFAULT);
                    } else {
                        membersDocRef.set({ list: FAMILY_MEMBERS_DEFAULT }).catch(err => handleFirestoreError(err));
                        setFamilyMembers(FAMILY_MEMBERS_DEFAULT);
                    }
                }, (error) => handleFirestoreError(error));

                return () => {
                    unsubscribeTx();
                    unsubscribeGoals();
                    unsubscribeBudgets();
                    unsubscribeMembers();
                };
            }, [fbServices, user, isOfflineMode]);

            const saveOffline = (key, data) => {
                if (isOfflineMode) {
                    localStorage.setItem(key, JSON.stringify(data));

            const triggerConfirm = (title, message, callback) => {
                setConfirmModal({ isOpen: true, title, message, onConfirm: () => { callback(); setConfirmModal({ isOpen: false }); } });

            const triggerPrompt = (title, placeholder, defaultValue, callback) => {
                setPromptModal({ isOpen: true, title, placeholder, defaultValue, onSubmit: (val) => { callback(val); setPromptModal({ isOpen: false }); } });

            useEffect(() => {

                        description: '',

                        amount: '',
                        type: 'expense',
                        status: 'pago',
                        image: ''

                setMatchedTransactionId('');
            }, [editingTransaction, isTransactionModalOpen]);

            useEffect(() => {
                if (editingGoal) {

                        name: editingGoal.name,
                        target: editingGoal.target.toString(),
                        deadline: editingGoal.deadline

                } else {
                    setGoalForm({
                        name: '',
                        target: '',
                        deadline: '2026-12'

                }
            }, [editingGoal, isGoalModalOpen]);

            const availableMonths = useMemo(() => {
                const months = transactions.map(t => t.date.substring(0, 7));
                const uniqueMonths = Array.from(new Set(months));
                if (!uniqueMonths.includes(selectedMonth)) {
                    uniqueMonths.push(selectedMonth);
                }
                return uniqueMonths.sort().reverse();
            }, [transactions, selectedMonth]);

            const filteredTransactions = useMemo(() => {
                return transactions.filter(t => {
                    const monthMatch = t.date.startsWith(selectedMonth);
                    const memberMatch = selectedMember === 'Todos' || t.member === selectedMember;
                    return monthMatch && memberMatch;
                });
            }, [transactions, selectedMonth, selectedMember]);

            const pendingAccounts = useMemo(() => {
                return transactions.filter(t => t.type === 'expense' && t.status === 'pendente');
            }, [transactions]);

            const metrics = useMemo(() => {
                let totalIncome = 0;
                let totalExpense = 0;
                let pendingExpense = 0;

                filteredTransactions.forEach(t => {
                    if (t.type === 'income') {
                        totalIncome += t.amount;
                    } else {
                        totalExpense += t.amount;
                        if (t.status === 'pendente') {
                            pendingExpense += t.amount;
                        }
                    }
                });

                const balance = totalIncome - totalExpense;
                const savingsRate = totalIncome > 0 ? ((totalIncome - totalExpense) / totalIncome) * 100 : 0;

                return { totalIncome, totalExpense, balance, savingsRate, pendingExpense };
            }, [filteredTransactions]);

            const categoryExpenses = useMemo(() => {
                const map = {};
                CATEGORIES.forEach(c => map[c.id] = 0);
                
                filteredTransactions.forEach(t => {
                    if (t.type === 'expense') {
                        map[t.category] = (map[t.category] || 0) + t.amount;
                    }
                });
                return map;
            }, [filteredTransactions]);

            const healthScoreData = useMemo(() => {
                let score = 100;
                const tips = [];

                if (metrics.savingsRate >= 20) {
                    score += 10;
                } else if (metrics.savingsRate > 0 && metrics.savingsRate < 15) {
                    score -= 15;
                    tips.push(`A taxa de poupança familiar está em ${metrics.savingsRate.toFixed(1)}%. O ideal é guardar pelo menos 15% das receitas.`);
                } else if (metrics.savingsRate <= 0) {
                    score -= 30;
                    tips.push("Atenção! As despesas superaram os rendimentos deste mês. Evite novas dívidas imediatas.");
                }

                let overBudgets = 0;
                CATEGORIES.forEach(c => {
                    const spent = categoryExpenses[c.id] || 0;
                    const limit = budgets[c.id] || 0;
                    if (limit > 0 && spent > limit) {
                        overBudgets++;
                        tips.push(`O limite de orçamento para '${c.label}' foi superado em R$ ${(spent - limit).toFixed(2)}.`);
                    }
                });

                score -= overBudgets * 12;

                if (metrics.pendingExpense > 0) {
                    tips.push(`Ainda existem R$ ${metrics.pendingExpense.toFixed(2)} em contas com status pendente.`);
                }

                score = Math.max(0, Math.min(100, score));

                let classification = 'Excelente';
                let scoreColor = 'text-emerald-500 bg-emerald-50';
                if (score < 50) {
                    classification = 'Crítico';
                    scoreColor = 'text-rose-500 bg-rose-50';
                } else if (score < 70) {
                    classification = 'Regular';
                    scoreColor = 'text-amber-500 bg-amber-50';
                } else if (score < 85) {
                    classification = 'Bom';
                    scoreColor = 'text-blue-500 bg-blue-50';
                }

                if (tips.length === 0) {
                    tips.push("Parabéns! Suas finanças estão totalmente organizadas e dentro dos limites estipulados.");
                }

                return { score, classification, scoreColor, tips };
            }, [metrics, categoryExpenses, budgets]);

            const monthlyHistory = useMemo(() => {
                const history = {};
                transactions.forEach(t => {
                    const month = t.date.substring(0, 7);
                    if (!history[month]) {
                        history[month] = { income: 0, expense: 0 };
                    }
                    if (t.type === 'income') {
                        history[month].income += t.amount;
                    } else {
                        history[month].expense += t.amount;
                    }
                });
                return Object.entries(history)
                    .sort((a, b) => a[0].localeCompare(b[0]))
                    .slice(-6);
            }, [transactions]);

            const handleEmailAuthSubmit = async (e) => {
                e.preventDefault();
                setAuthErrorMsg(null);
                const { auth } = fbServices;

                if (!auth) {
                    setAuthErrorMsg("Serviço de autenticação offline.");
                    return;
                }

                try {
                    if (authTab === 'login') {
                        await auth.signInWithEmailAndPassword(emailInput, passwordInput);
                        showToast("Sessão iniciada com sucesso!");
                    } else {
                        await auth.createUserWithEmailAndPassword(emailInput, passwordInput);
                        showToast("Conta criada com sucesso! Bem-vindo.");
                    }
                } catch (err) {
                    console.error(err);
                    if (err.code === 'auth/invalid-credential') {
                        setAuthErrorMsg("E-mail ou palavra-passe incorretos.");
                    } else if (err.code === 'auth/email-already-in-use') {
                        setAuthErrorMsg("Este e-mail já está em utilização.");
                    } else {
                        setAuthErrorMsg(err.message);
                    }
                }
            };

                setAuthErrorMsg(null);
                const { auth } = fbServices;
                if (!auth) {
                    setAuthErrorMsg("Serviço de autenticação offline.");
                    return;
                }
                const provider = new firebase.auth.GoogleAuthProvider();
                try {
                    await auth.signInWithPopup(provider);
                    showToast("Conectado com o Google!");
                } catch (err) {
                    console.error(err);
                    if (err.code === 'auth/unauthorized-domain') {
                        const currentDomain = window.location.hostname || "o domínio atual";
                        setAuthErrorMsg(
                            <div className="text-left space-y-1 mt-1 leading-relaxed text-xs">
                                <span className="font-bold block text-sm mb-1 text-rose-300">
                                    <i className="fa-solid fa-triangle-exclamation mr-1"></i> Domínio Não Autorizado no Firebase!
                                </span>
                                <span>Para resolver este erro e ativar o login do Google:</span>
                                <ol className="list-decimal list-inside ml-2 text-[11px] space-y-1 font-semibold text-slate-300">
                                    <li>Abra a <a href="https://console.firebase.google.com/" target="_blank" rel="noopener noreferrer" className="underline text-indigo-400 font-bold hover:text-indigo-300">Consola do Firebase</a>.</li>
                                    <li>Vá a <strong>Authentication</strong> &gt; aba <strong>Definições</strong> (Settings).</li>
                                    <li>Em <strong>Domínios Autorizados</strong>, clique em "Adicionar domínio".</li>

            // Processador Multimodal de Imagens atualizado para o modelo gemini-2.5-flash-preview-09-2025 (MANDATÓRIO)
            const handleImageUploadAndOCR = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsScanningImage(true);
                showToast("A compactar imagem e a analisar com o Gemini 2.5 IA...", "info");

                try {
                    const compressedBase64 = await compressImageFile(file, 450, 450, 0.6);
                    setScannedPreview(compressedBase64);
                    setTxForm(prev => ({ ...prev, image: compressedBase64 }));

                    const rawBase64Data = compressedBase64.split(',')[1];
                    const systemPrompt = `Você é o leitor financeiro de Inteligência Artificial do FinFamily, especializado em boletos, faturas de concessionárias (ENEL, Sabesp, Vivo), extratos e comprovantes de pagamentos.
Sua missão é ler o documento e categorizar com precisão nas categorias permitidas: Moradia, Alimentação, Transporte, Lazer, Saúde, Educação, Vestuário, Outros.
Defina a data no padrão 'YYYY-MM-DD'. Retorne dados de forma estritamente estruturada em JSON sem formatação adicional ou tags markdown.`;

                    const userQuery = `Analise o documento e extraia o valor do pagamento/débito, fornecedor e data de vencimento/pagamento.
Se o propósito for 'boleto' (lançamento de débito pendente), configure o 'status' as 'pendente'. Se for 'comprovante', configure como 'pago'.
Propósito solicitado: "${scanPurpose}"`;

                    const payload = {
                        contents: [{
                            role: "user",
                            parts: [
                                { text: userQuery },
                                {
                                    inlineData: {
                                        mimeType: "image/jpeg",
                                        data: rawBase64Data
                                    }
                                }
                            ]
                        }],
                        systemInstruction: {
                            parts: [{ text: systemPrompt }]
                        },
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    description: { type: "STRING" },
                                    amount: { type: "NUMBER" },
                                    category: { type: "STRING", enum: ["Moradia", "Alimentação", "Transporte", "Lazer", "Saúde", "Educação", "Vestuário", "Outros"] },
                                    type: { type: "STRING", enum: ["expense"] },
                                    status: { type: "STRING", enum: ["pago", "pendente"] },
                                    date: { type: "STRING" },
                                    member: { type: "STRING" }
                                },
                                required: ["description", "amount", "category", "type", "status", "date", "member"]
                            }
                        }
                    };

                    const apiKey = ""; // Mantido vazio para a injeção do ambiente em runtime (MANDATÓRIO)
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

                    const response = await fetchWithRetry(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`Erro na comunicação com a IA: ${response.status}`);
                    }

                    const result = await response.json();
                    const textResponse = result.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (textResponse) {
                        // Limpa tags de código markdown caso venham por engano
                        let cleanText = textResponse;
                        if (cleanText.includes("```")) {
                            cleanText = cleanText.replace(/```json/g, "").replace(/```/g, "").trim();
                        }
                        
                        const parsedData = JSON.parse(cleanText);
                        const assignedMember = familyMembers.includes(parsedData.member) ? parsedData.member : 'Geral';

                        setTxForm(prev => ({
                            ...prev,
                            date: parsedData.date || '2026-05-30',
                            member: assignedMember,
                            description: parsedData.description || 'Lançamento IA',
                            category: parsedData.category || 'Outros',
                            amount: parsedData.amount ? parsedData.amount.toString() : '0',
                            type: 'expense',
                            status: scanPurpose === 'comprovante' ? 'pago' : 'pendente'
                        }));

                        if (scanPurpose === 'comprovante') {
                            const parsedVal = parseFloat(parsedData.amount) || 0;
                            const possibleMatch = pendingAccounts.find(t => {
                                const valueMatch = Math.abs(t.amount - parsedVal) < 1.5;
                                const descMatch = t.description.toLowerCase().includes(parsedData.description.toLowerCase()) || 
                                                 parsedData.description.toLowerCase().includes(t.description.toLowerCase());
                                return valueMatch || descMatch;
                            });

                            if (possibleMatch) {
                                setMatchedTransactionId(possibleMatch.id);
                                showToast(`A IA associou este comprovativo à conta: "${possibleMatch.description}" de R$ ${possibleMatch.amount.toFixed(2)}`, "info");
                            } else {
                                showToast("Leitura concluída! Não foi encontrada nenhuma conta correspondente para liquidação.", "info");
                            }
                        } else {
                            showToast("Fatura futura identificada e pré-preenchida com sucesso!", "success");
                        }
                    }
                } catch (error) {
                    console.error(error);
                    showToast("Erro ao processar imagem. Preencha manualmente os dados da fatura.", "error");
                } finally {
                    setIsScanningImage(false);
                }
            };

            const generateGeminiAdvice = async () => {

            const renderMarkdown = (text) => {
                if (!text) return null;
                return text.split('\n').map((line, idx) => {
                    let trimmed = line.trim();
                    if (!trimmed) return <div key={idx} className="h-2"></div>;
                    if (trimmed.startsWith('###')) {
                        return <h5 key={idx} className="text-sm font-bold text-slate-800 mt-4 mb-2">{trimmed.replace('###', '').trim()}</h5>;

                        return <li key={idx} className="ml-5 list-disc text-xs text-slate-600 mb-1.5">{trimmed.substring(1).trim()}</li>;

                    return <p key={idx} className="text-xs text-slate-600 mb-2">{trimmed}</p>;

                                            {txForm.status === 'pago' && (
                                                <div>
                                                    <label className="block text-[11px] font-extrabold text-indigo-900 uppercase tracking-wider mb-1">Vincular a uma conta em aberto</label>
                                                    <select value={matchedTransactionId} onChange={(e) => { const id = e.target.value; setMatchedTransactionId(id); const orig = transactions.find(t => t.id === id); if (orig) { setTxForm(prev => ({ ...prev, description: orig.description, category: orig.category, amount: orig.amount.toString(), member: orig.member })); } }} className="w-full bg-white border border-indigo-200 rounded-xl px-3 py-2 text-xs font-bold text-indigo-950">
                                                        <option value="">Lançar despesa avulsa (Sem vínculo)</option>
                                                        {pendingAccounts.map(t => (
                                                            <option key={t.id} value={t.id}>{t.description} - R$ {t.amount.toFixed(2)}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                            )}

                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Tipo de Fluxo</label>
                                                    <select value={txForm.type} onChange={(e) => setTxForm({...txForm, type: e.target.value})} className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-semibold">
                                                        <option value="expense">Despesa</option>
                                                        <option value="income">Receita</option>
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Responsável</label>
                                                    <select value={txForm.member} onChange={(e) => setTxForm({...txForm, member: e.target.value})} className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-semibold">
                                                        {familyMembers.map(m => m !== 'Todos' && <option key={m} value={m}>{m}</option>)}
                                                    </select>
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Descrição</label>
                                                <input type="text" required value={txForm.description} onChange={(e) => setTxForm({...txForm, description: e.target.value})} placeholder="Ex: Conta da Água" className="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-semibold" />
                                            </div>

                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Valor (€ / R$)</label>
                                                    <input type="number" step="0.01" required value={txForm.amount} onChange={(e) => setTxForm({...txForm, amount: e.target.value})} placeholder="0.00" className="w-full bg-white border border-slate-200 rounded-xl px-4 py-2 text-sm font-bold" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Categoria</label>
                                                    <select value={txForm.category} onChange={(e) => setTxForm({...txForm, category: e.target.value})} className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-semibold">
                                                        {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                                                        <option value="Receita">Faturamento / Receita</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Vencimento / Data</label>
                                                    <input type="date" required value={txForm.date} onChange={(e) => setTxForm({...txForm, date: e.target.value})} className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-semibold" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Estado de Liquidação</label>
                                                    <select value={txForm.status} onChange={(e) => setTxForm({...txForm, status: e.target.value})} className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-semibold">
                                                        <option value="pago">Pago (Liquidado)</option>
                                                        <option value="pendente">Pendente (Por Pagar)</option>
                                                    </select>
                                                </div>
                                            </div>

                                            {txForm.image && (
                                                <div className="pt-2 border-t border-slate-200">
                                                    <span className="block text-xs font-bold text-slate-500 uppercase mb-1">Ficheiro Anexado:</span>
                                                    <div className="flex items-center gap-3 bg-white p-2.5 rounded-xl border border-slate-200">
                                                        <img src={txForm.image} className="w-12 h-12 object-cover rounded-lg border" alt="Anexo Miniatura" />
                                                        <div className="flex-1">
                                                            <button type="button" onClick={() => setViewingImage(txForm.image)} className="text-xs text-indigo-600 hover:underline font-bold block">Ampliar Imagem</button>
                                                            <button type="button" onClick={() => setTxForm(prev => ({ ...prev, image: '' }))} className="text-xs text-rose-600 hover:underline font-bold block mt-0.5"><i className="fa-solid fa-trash-can mr-1"></i>Remover Ficheiro</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        <div className="flex gap-3 pt-4 border-t border-slate-100">
                                            <button type="button" onClick={() => setIsTransactionModalOpen(false)} className="flex-1 py-2.5 border border-slate-200 rounded-xl text-xs font-bold text-slate-500">Cancelar</button>
                                            <button type="submit" className="flex-1 py-2.5 bg-indigo-600 text-white font-bold rounded-xl text-xs shadow-md">Guardar Registo</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL CONFIGURAÇÃO BANCO */}
                    {isConfigModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <form onSubmit={handleConfigSetupSubmit} className="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-md text-white space-y-4 animate-fadeIn">
                                <h3 className="font-extrabold text-lg"><i className="fa-solid fa-gears text-indigo-400"></i> Conectar meu Firebase</h3>
                                <p className="text-xs text-slate-400">Insira a configuração JSON gerada no console do seu projeto Firebase gratuito para usá-lo como banco de dados em tempo real:</p>
                                
                                <textarea name="fbConfigData" required rows="6" placeholder='{ "apiKey": "AIzaSy...", "authDomain": "...", "projectId": "..." }' className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs font-mono text-indigo-300 focus:outline-none focus:ring-1 focus:ring-indigo-500"></textarea>
                                
                                <div className="flex gap-2">
                                    <button type="button" onClick={() => setIsConfigModalOpen(false)} className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-750 rounded-xl text-xs font-bold">Voltar</button>
                                    <button type="submit" className="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 rounded-xl text-xs font-bold text-white shadow-md">Guardar & Sincronizar</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* MODAL METAS */}
                    {isGoalModalOpen && (
                        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl w-full max-w-md shadow-2xl overflow-hidden border border-slate-100 animate-fadeIn">
                                <div className="p-6 bg-slate-900 text-white flex justify-between items-center">
                                    <h3 className="font-extrabold text-lg flex items-center gap-2"><i className="fa-solid fa-bullseye"></i> {editingGoal ? 'Editar Objetivo' : 'Planear Objetivo Familiar'}</h3>
                                    <button onClick={() => setIsGoalModalOpen(false)} className="text-slate-400 hover:text-white transition"><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>

                                <form onSubmit={handleGoalFormSubmit} className="p-6 space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Nome do Objetivo</label>
                                        <input type="text" required value={goalForm.name} onChange={(e) => setGoalForm({...goalForm, name: e.target.value})} placeholder="Ex: Viagem de Férias" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-semibold" />
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Alvo Esperado (R$ / €)</label>
                                            <input type="number" required value={goalForm.target} onChange={(e) => setGoalForm({...goalForm, target: e.target.value})} placeholder="Ex: 5000" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-bold" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Prazo Alvo</label>
                                            <input type="month" required value={goalForm.deadline} onChange={(e) => setGoalForm({...goalForm, deadline: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-semibold" />
                                        </div>
                                    </div>

                                    <div className="flex gap-3 pt-4 border-t border-slate-100">
                                        <button type="button" onClick={() => setIsGoalModalOpen(false)} className="flex-1 py-2.5 border border-slate-200 rounded-xl text-xs font-bold text-slate-500">Cancelar</button>
                                        <button type="submit" className="flex-1 py-2.5 bg-indigo-600 text-white font-bold rounded-xl text-xs shadow-md">Guardar Meta</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ASSISTENCIA GEMINI INTELIGENTE GAVETA */}
                    <div className="fixed bottom-6 right-6 z-40">
                        <button onClick={() => { setIsAssistantOpen(true); if (assistantMessages.length === 0) handleSendAssistantMessage(); }} className="bg-gradient-to-r from-indigo-600 via-violet-600 to-fuchsia-600 hover:from-indigo-700 hover:to-fuchsia-700 text-white font-bold py-3.5 px-6 rounded-2xl shadow-2xl hover:shadow-indigo-500/30 transition-all duration-300 transform hover:-translate-y-1 flex items-center gap-3 border border-indigo-400/30">
                            <div className="relative">
                                <i className="fa-solid fa-wand-magic-sparkles text-lg"></i>
                                <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-emerald-400 rounded-full animate-ping"></span>
                                <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-emerald-50 rounded-full"></span>
                            </div>
                            <span className="text-sm tracking-wide font-bold">Consultar IA Gemini</span>
                        </button>
                    </div>

                    {isAssistantOpen && (
                        <div className="fixed inset-0 z-50 flex justify-end bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
                            <div className="bg-white w-full max-w-lg h-full shadow-2xl flex flex-col justify-between animate-slideIn">
                                <div className="p-5 bg-gradient-to-r from-indigo-950 via-slate-900 to-indigo-950 text-white flex items-center justify-between border-b border-indigo-800/30">
                                    <div className="flex items-center gap-3">
                                        <div className="bg-gradient-to-tr from-indigo-500 via-violet-500 to-pink-500 p-2.5 rounded-xl shadow-md"><i className="fa-solid fa-brain text-white text-lg"></i></div>
                                        <div>
                                            <h3 className="font-extrabold text-base tracking-tight">Assessoria Virtual Gemini</h3>
                                            <span className="text-[10px] text-indigo-200 font-bold uppercase tracking-wider block">Ativo em {selectedMonth}</span>
                                        </div>
                                    </div>
                                    <button onClick={() => setIsAssistantOpen(false)} className="p-2 hover:bg-white/10 rounded-lg text-slate-300 hover:text-white"><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-5 space-y-4 bg-slate-50/70">
                                    {assistantMessages.map((msg, idx) => {
                                        const isUser = msg.role === 'user';
                                        return (
                                            <div key={idx} className={`flex ${isUser ? 'justify-end' : 'justify-start'}`}>
                                                <div className={`max-w-[88%] rounded-2xl p-4 shadow-sm text-xs leading-relaxed ${isUser ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-white text-slate-700 border border-slate-100 rounded-tl-none'}`}>
                                                    {!isUser && <div className="font-bold text-[10px] text-indigo-600 mb-2 uppercase tracking-wide"><i className="fa-solid fa-robot"></i> Inteligência Artificial</div>}
                                                    <div className="space-y-1">{isUser ? msg.text : renderMarkdown(msg.text)}</div>
                                                </div>
                                            </div>
                                        );
                                    })}

                                    {isAssistantLoading && (
                                        <div className="flex justify-start">
                                            <div className="bg-white border border-slate-100 rounded-2xl p-4 max-w-[85%] space-y-2 text-xs text-slate-500">
                                                <div className="flex items-center gap-2 text-indigo-600 font-bold"><i className="fa-solid fa-circle-notch animate-spin"></i><span>O Gemini está a avaliar os seus fluxos familiares...</span></div>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="p-4 bg-white border-t border-slate-100">
                                    <form onSubmit={handleSendAssistantMessage} className="flex gap-2">
                                        <input type="text" value={assistantInput} onChange={(e) => setAssistantInput(e.target.value)} placeholder="Tire as suas dúvidas financeiras com o Gemini..." className="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-xs font-semibold" disabled={isAssistantLoading} />
                                        <button type="submit" disabled={isAssistantLoading || !assistantInput.trim()} className="bg-indigo-600 text-white py-3 px-4.5 rounded-xl shadow-md transition flex items-center justify-center"><i className="fa-solid fa-paper-plane text-xs"></i></button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="bg-slate-900 border-t border-slate-855 py-6 text-center text-slate-400 text-xs mt-12">
                        <p>© 2026 FinFamily. O controlo financeiro inteligente de toda a sua família.</p>
                        <p className="mt-1 text-slate-500">Desenvolvido com foco em usabilidade, segurança e sincronização nativa em tempo real.</p>
                    </footer>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
